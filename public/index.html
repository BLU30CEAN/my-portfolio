    <!--
      First-paint 테마 동기화: React 마운트 전에 저장된 mode/시스템 prefer를 읽어
      data-theme 과 body 배경을 미리 칠한다. 다크 -> 라이트 깜빡임을 제거.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = stored === "light" || stored === "dark"
            ? stored
            : prefersDark ? "dark" : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", resolved);
          root.style.colorScheme = resolved;
          var bg = resolved === "dark" ? "#04101f" : "#f4f8fd";
          var fg = resolved === "dark" ? "#eaf3ff" : "#0b1a2a";
          root.style.background = bg;
          root.style.color = fg;
        } catch (e) {}
      })();
    </script>

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — rafgraph/spa-github-pages (MIT)
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
