services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: admin_studio
    ports:
      - "5433:5432"
    volumes:
      - admin_studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d admin_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db:5432/admin_studio
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      ADMIN_API_KEY: dev-admin-key-change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 기존 Express(문의·게스트북) — 선택 기동
  node-api:
    profiles: ["legacy"]
    build:
      context: ./server
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:3100
    ports:
      - "5000:5000"

volumes:
  admin_studio_pg:
